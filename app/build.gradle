plugins { id 'com.android.application' }
android {
 namespace 'org.fourdisplay.studio'
 compileSdk 35
 defaultConfig { applicationId 'org.fourdisplay.studio'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3-storyboard' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 def keyFile = System.getenv('ANDROID_KEYSTORE_FILE')
 if (keyFile) {
  signingConfigs { stable { storeFile file(keyFile); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') } }
  buildTypes { debug { signingConfig signingConfigs.stable } }
 }
}
