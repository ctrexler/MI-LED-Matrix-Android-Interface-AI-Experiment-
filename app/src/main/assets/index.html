<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'"><title>Four Display Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header><button id="menuBtn" class="icon" aria-label="Open menu" aria-expanded="false">☰</button><div class="title"><strong id="pageTitle">Editor</strong><small id="saveState">Draft saved</small></div><button id="connectionBtn" class="badge" title="Connection status">0/4</button><button id="saveBtn" class="primary">Save</button></header>
<div id="drawerShade" class="shade" hidden></div><aside id="drawer" hidden aria-label="Navigation"><h2>Four Display Studio</h2><button data-page="editor">✏️ Editor</button><button data-page="library">📚 Library</button><button data-page="devices">🖥️ Displays</button><button data-page="logs">📋 Logs</button><p>Images and patterns stay on your phone.</p></aside>
<main>
<section id="editor" class="page editor"><div class="nameRow"><input id="sequenceName" aria-label="Sequence name" maxlength="100"><button id="newBtn">New</button><span id="count" class="muted"></span></div><div id="storyboard" class="storyboard" aria-label="Sequence storyboard"></div>
<div class="preview"><div class="previewLeft"><div id="largePreview" class="wall" aria-label="Selected step"></div><small id="position">No steps</small></div><div class="previewRight"><b>Phone preview</b><div class="controls"><button id="playBtn">Play</button><button id="fasterBtn" aria-label="Faster preview">−</button><span id="speed">1.5 s</span><button id="slowerBtn" aria-label="Slower preview">+</button></div><label class="toggle"><input id="liveToggle" type="checkbox">Live Preview</label><small id="liveState">Displays off · phone only</small></div></div>
<footer><div class="actions"><button id="sendBtn" class="primary">Send to displays</button><button id="storedPlayBtn">Start stored slideshow</button></div><div id="transfer" hidden><span id="transferText">Uploading…</span><progress id="transferProgress" value="0" max="1"></progress><button id="cancelTransfer">Cancel</button></div><p id="notice" role="status"></p></footer></section>
<section id="library" class="page" hidden><div class="pageTools"><h1>Library</h1><button id="libraryNewBtn">New</button><button id="exportBtn">Export</button><button id="importBtn">Import</button></div><div id="libraryPlayback" class="playBanner" hidden><span id="libraryPlaybackText"></span><button id="stopLibraryBtn">Stop</button></div><div id="libraryList" class="scrollArea"></div></section>
<section id="devices" class="page" hidden><div class="pageTools"><h1>Displays</h1><button id="reconnectBtn" class="primary">Reconnect all</button><button id="disconnectBtn">Disconnect</button></div><div class="scrollArea"><label class="field">Physical arrangement<select id="layout"><option value="2">2 × 2</option><option value="4">4 across</option><option value="1">4 stacked</option></select></label><p class="hint">Slots run left-to-right, then top-to-bottom. Applies to all sequences. New spanning sources are re-split when this changes.</p><div id="assignments"></div></div></section>
<section id="logs" class="page" hidden><div class="pageTools"><h1>Logs</h1><button id="clearLogBtn">Clear</button></div><pre id="log" class="scrollArea"></pre></section>
</main><div id="sheetShade" class="shade" hidden></div><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden tabindex="-1"><div class="sheetHeader"><h2 id="sheetTitle"></h2><button id="closeSheetBtn" class="icon" aria-label="Close">×</button></div><div id="sheetBody"></div></section><input id="imagePicker" type="file" accept="image/*" hidden><script src="app.js"></script></body></html>
