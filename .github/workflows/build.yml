name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate v0.5 updated source files
        run: |
          python3 tools/apply_v05.py
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/update-v05.js
      - name: Upload complete generated source project
        uses: actions/upload-artifact@v4
        with:
          name: LED-Matrix-Controller-v0.5.0-full-source
          path: generated-v05/LED-Matrix-Controller-v0.5.0-full-source.zip
          retention-days: 7
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Optional signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/app-signing.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/app-signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Temporary debug signing: export your library before uninstalling an old build."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LED-Matrix-Controller-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
