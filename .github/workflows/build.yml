name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate web assets syntax
        run: |
          node --check app/src/main/assets/app.js
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Optional signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/app-signing.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/app-signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Temporary debug signing: export your library before uninstalling an old build."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          test -f settings.gradle
          test -f app/build.gradle
          gradle --no-daemon :app:assembleDebug -PappVersionCode=$VERSION_CODE -PappVersionName=0.5.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LED-Matrix-Controller.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LED-Matrix-Controller-apk
          path: app/build/outputs/apk/debug/LED-Matrix-Controller.apk
          retention-days: 7
      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (#${{ github.run_number }})
          body: |
            versionCode:${{ env.VERSION_CODE }}
            versionName:0.5.${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/debug/LED-Matrix-Controller.apk
          make_latest: true
